name: Keep Services Alive
on:
  schedule:
    - cron: '0 1,9,17 * * *'
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (with DB query)
        run: curl -sf https://dafa-music-erp-backend-1.onrender.com/health > /dev/null
      - name: Ping frontend
        run: curl -s https://erp.discovermusic888.com > /dev/null
